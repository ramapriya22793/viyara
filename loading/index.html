<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viyara | Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #162436;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Background grid overlay matching the app preloader */
    .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px), 
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient glow behind logo */
    .ambient-glow {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
      filter: blur(20px);
      pointer-events: none;
      z-index: 1;
      animation: pulse Glow 2s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.9);
        opacity: 0.3;
      }
      100% {
        transform: scale(1.3);
        opacity: 0.6;
      }
    }

    /* Center logo monogram container */
    .logo-container {
      position: relative;
      width: 128px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: fadeInLogo 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    @keyframes fadeInLogo {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Infinite progress loading bar at the bottom */
    .progress-bar-container {
      position: absolute;
      bottom: 64px;
      left: 48px;
      right: 48px;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      z-index: 10;
    }

    /* Responsive width for desktop */
    @media (min-width: 768px) {
      .progress-bar-container {
        left: 33.333%;
        right: 33.333%;
      }
    }

    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #ffffff, transparent);
      transform-origin: left;
      animation: loadingAnim 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loadingAnim {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    /* Touch redirection banner at the top/center (subtle visual indicator) */
    .tap-hint {
      position: absolute;
      bottom: 32px;
      color: rgba(255, 255, 255, 0.3);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: color 0.3s ease;
      z-index: 10;
    }

    body:hover .tap-hint {
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body onclick="goToConsultation()" ontouchstart="goToConsultation()">

  <!-- Background grid layer -->
  <div class="grid-bg"></div>

  <!-- Centered Logo Monogram -->
  <div class="logo-container">
    <div class="ambient-glow"></div>
    <img src="/logo-white.png" alt="VIYARA Logo" class="logo-img">
  </div>

  <!-- Bottom progress loader line -->
  <div class="progress-bar-container">
    <div class="progress-bar-fill"></div>
  </div>

  <!-- Touch/Click to start hint -->
  <div class="tap-hint">Tap Screen to Consult</div>

  <script>
    function goToConsultation() {
      // Redirect to the live service consultation form page
      window.location.href = 'https://viyara.co.in/#service-form';
    }
  </script>
</body>
</html>
